app-id: io.github.quodlibet.QuodLibet
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: quodlibet
build-options:
  no-debuginfo: true
  strip: true
finish-args:
  - --share=network
  - --socket=fallback-x11
  - --share=ipc
  - --socket=wayland
  - --socket=pulseaudio
  - --filesystem=host

  # some embedded covers and the fifo is still shared through /tmp
  - --filesystem=/tmp

  # Various D-Bus names: for...
  # ...multimedia keys
  - --talk-name=org.gnome.SettingsDaemon.MediaKeys
  - --talk-name=org.mate.SettingsDaemon

  # ...detecting the running desktop environment
  - --talk-name=com.canonical.Unity.Launcher
  - --talk-name=org.enlightenment.wm.service
  - --talk-name=org.kde.plasmashell

  # ...MPRIS support
  - --own-name=org.mpris.quodlibet
  - --own-name=org.mpris.MediaPlayer2.quodlibet

  # ...various other plugins
  - --own-name=org.gnome.UPnP.MediaServer2.QuodLibet
  - --talk-name=org.freedesktop.Avahi
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.Telepathy.AccountManager
  - --talk-name=org.gajim.dbus
  - --talk-name=org.gnome.ScreenSaver
  - --talk-name=org.gnome.SessionManager
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.xfce.FileManager

modules:
  - python-modules.yaml
  - flathub-shared-modules/dbus-glib/dbus-glib.json
  - flathub-shared-modules/libappindicator/libappindicator-gtk3-introspection-12.10.json

  - name: kakasi
    sources:
      - type: archive
        url: http://kakasi.namazu.org/stable/kakasi-2.3.6.tar.xz
        sha256: 2ee57b1b03c74fd5766e741c3812028efc73bc0e0bf93a6e7ff20eb4701f3ee3
        x-checker-data:
          type: anitya
          project-id: 1487
          url-template: http://kakasi.namazu.org/stable/kakasi-$version.tar.xz
      - type: patch
        paths:
          - patches/kakasi-configure-c99.patch
      - type: shell
        commands:
          - autoreconf -vfi -I /usr/share/gettext/m4
    build-options:
      cflags: -std=gnu17
    cleanup:
      - /lib
      - /include

  - name: ffmpeg
    buildsystem: autotools
    config-opts:
      - --disable-doc
      - --disable-static
      - --enable-shared
      - --enable-optimizations
      - --disable-everything
      - --enable-decoder=ape,dca,eac3,mlp,tak,truehd,wmav1,wmav2,wmapro,tta,mpc7,mpc8,alac,dsd_lsbf,dsd_lsbf_planar,dsd_msbf,dsd_msbf_planar,aac,aac_fixed,aac_latm
      - --enable-demuxer=asf,xwma,tta,mpc,mpc8,dsf
      - --enable-protocol=file
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz
        sha256: 7138d28c96d9d3e3af4ee3d8cad72741f8ffb40da90c1112235dea3ecd3178a3
        x-checker-data:
          type: anitya
          project-id: 5405
          stable-only: true
          versions: {<: '8.2'}
          url-template: https://ffmpeg.org/releases/ffmpeg-$version.tar.xz
    cleanup:
      - /share/ffmpeg

  - name: chromaprint
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTS=off
      - -DBUILD_TOOLS=off
      - -DAUDIO_PROCESSOR_LIB=dummy
    sources:
      - type: archive
        url: https://github.com/acoustid/chromaprint/releases/download/v1.6.2/chromaprint-1.6.2.tar.gz
        sha256: d54ada62c16b2db396d3251ec54fc7a58909c163131a1cfcf7fa6407dbc14360
        x-checker-data:
          type: anitya
          project-id: 286
          url-template: https://github.com/acoustid/chromaprint/releases/download/v$version/chromaprint-$version.tar.gz

  - name: libbs2b
    rm-configure: true
    sources:
      - type: archive
        url: https://sourceforge.net/projects/bs2b/files/libbs2b/3.1.0/libbs2b-3.1.0.tar.gz
        sha256: 6aaafd81aae3898ee40148dd1349aab348db9bfae9767d0e66e0b07ddd4b2528
        x-checker-data:
          type: anitya
          project-id: 1566
          url-template: https://sourceforge.net/projects/bs2b/files/libbs2b/$version/libbs2b-$version.tar.gz
      - type: script
        dest-filename: autogen.sh
        commands:
          - cp -p /usr/share/automake-*/config.{sub,guess} build-aux
          - autoreconf -vfi
      - type: patch
        path: patches/bs2b-fix-automake-dist-lzma.patch
    cleanup:
      - /bin

  - name: soundtouch
    sources:
      - type: archive
        url: https://codeberg.org/soundtouch/soundtouch/archive/2.4.1.tar.gz
        sha256: e07abf20ce8f95850c280132e1f61ad400fc1f4011b7fac698a503de6aab6733
        x-checker-data:
          type: anitya
          project-id: 115722
          url-template: https://codeberg.org/soundtouch/soundtouch/archive/$version.tar.gz

  - name: gst-plugins-ugly
    buildsystem: meson
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-plugins-ugly/gst-plugins-ugly-1.28.9.tar.xz
        sha256: 550a52536962186f5488e06b5c08f31ae0f18400aee32a3385156d31cb4b1189
        x-checker-data:
          type: anitya
          project-id: 15187
          stable-only: true
          versions: {<: '1.29'}
          url-template: https://gstreamer.freedesktop.org/src/gst-plugins-ugly/gst-plugins-ugly-$version.tar.xz

  - name: libgme
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/libgme/game-music-emu/archive/refs/tags/0.6.5.tar.gz
        sha256: 8531678502451c2cf04248cda45c8b4645e19fcfb63e6a7ec2549641c47bb392
        x-checker-data:
          type: anitya
          project-id: 866
          stable-only: true
          url-template: https://github.com/libgme/game-music-emu/archive/refs/tags/$version.tar.gz

  - name: gst-plugins-bad
    buildsystem: meson
    config-opts:
      - -Dwebrtcdsp=disabled
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-plugins-bad/gst-plugins-bad-1.28.9.tar.xz
        sha256: 4a4e0b7bf84f868378c48f143a7ac3a98923b488a5b74f1a35ba46bc3c43f6b1
        x-checker-data:
          type: anitya
          project-id: 21849
          stable-only: true
          versions: {<: '1.29'}
          url-template: https://gstreamer.freedesktop.org/src/gst-plugins-bad/gst-plugins-bad-$version.tar.xz

  - name: gst-libav
    buildsystem: meson
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-libav/gst-libav-1.28.9.tar.xz
        sha256: 4b3df21fa70972a80891d2298cf32c14a62c3db4483d545c7ac018230399186b
        x-checker-data:
          type: anitya
          project-id: 21848
          stable-only: true
          versions: {<: '1.29'}
          url-template: https://gstreamer.freedesktop.org/src/gst-libav/gst-libav-$version.tar.xz

  - name: dbus-python
    buildsystem: meson
    sources:
      - type: archive
        url: https://dbus.freedesktop.org/releases/dbus-python/dbus_python-1.5.1.tar.gz
        sha256: 57423cf87d09b7d084f420b55b737fe654c33339b06df77945620d97795c6ac4
        x-checker-data:
          type: anitya
          project-id: 402
          url-template: https://dbus.freedesktop.org/releases/dbus-python/dbus_python-$version.tar.gz

  - name: quodlibet
    buildsystem: simple
    build-commands:
      - python3 setup.py install --prefix=${FLATPAK_DEST} --root=/
      # https://github.com/pypa/setuptools/issues/4934
      - sed -i '1s|.*|#!/usr/bin/env python|' /app/bin/quodlibet
    sources:
      - type: git
        url: https://github.com/quodlibet/quodlibet.git
        tag: release-4.7.1
        commit: f98c33c9fcaf222f3f259ccdd8e79adc833734a0
        x-checker-data:
          type: git
          tag-pattern: ^release-([\d.]+)$

cleanup:
  - /include
  - /share/gtk-doc
  - /share/gir-1.0
  - '*.la'
  - '*.a'
cleanup-commands:
  - python3 -m compileall -f --invalidation-mode=unchecked-hash /app
